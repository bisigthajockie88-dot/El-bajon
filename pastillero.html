<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastillero</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap');

  :root {
    --bg: #F7F5F2;
    --surface: #FFFFFF;
    --surface2: #F0EDE8;
    --border: #E5E0D8;
    --text: #1A1714;
    --text-soft: #7A7268;
    --accent: #4A7C59;
    --accent-light: #E8F2EC;
    --accent-hover: #3D6849;
    --taken: #4A7C59;
    --skipped: #C9614A;
    --skipped-light: #FAEDE9;
    --pending: #E8A63A;
    --pending-light: #FDF3E1;
    --radius: 16px;
    --shadow: 0 2px 16px rgba(26,23,20,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .app-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .date-label {
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 400;
  }

  .streak-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--accent-light);
    color: var(--accent);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 16px 24px 0;
  }

  .tab {
    flex: 1;
    padding: 9px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-soft);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* SECTIONS */
  .section { display: none; padding: 20px 24px; }
  .section.active { display: block; }

  /* TODAY CARD */
  .today-hero {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  .today-pill-name {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--text);
    margin-bottom: 4px;
  }

  .today-pill-sub {
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 20px;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-weight: 500;
    font-size: 15px;
  }

  .status-indicator.taken { background: var(--accent-light); color: var(--taken); }
  .status-indicator.pending { background: var(--pending-light); color: var(--pending); }
  .status-indicator.skipped { background: var(--skipped-light); color: var(--skipped); }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-indicator.taken .status-dot { background: var(--taken); }
  .status-indicator.pending .status-dot { background: var(--pending); animation: pulse 2s infinite; }
  .status-indicator.skipped .status-dot { background: var(--skipped); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .action-buttons {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }

  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text-soft);
  }

  .btn-secondary:hover { background: var(--border); }

  .btn-danger {
    background: var(--skipped-light);
    color: var(--skipped);
  }

  .btn-danger:hover { background: #f5d5ce; }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }

  /* TIME TAKEN */
  .time-taken-info {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-soft);
    text-align: center;
    padding: 10px;
    background: var(--surface2);
    border-radius: 10px;
  }

  /* STATS ROW */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 16px 12px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .stat-number {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-number.green { color: var(--taken); }
  .stat-number.orange { color: var(--skipped); }
  .stat-number.gold { color: var(--pending); }

  .stat-label {
    font-size: 11px;
    color: var(--text-soft);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* SECTION TITLE */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
  }

  /* HISTORY LIST */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-day {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .history-day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }

  .history-day-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .day-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .day-icon.taken { background: var(--accent-light); }
  .day-icon.skipped { background: var(--skipped-light); }
  .day-icon.pending { background: var(--pending-light); }

  .day-date {
    font-weight: 500;
    font-size: 15px;
  }

  .day-relative {
    font-size: 12px;
    color: var(--text-soft);
  }

  .day-status-chip {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
  }

  .day-status-chip.taken { background: var(--accent-light); color: var(--taken); }
  .day-status-chip.skipped { background: var(--skipped-light); color: var(--skipped); }
  .day-status-chip.pending { background: var(--pending-light); color: var(--pending); }

  .history-day-detail {
    display: none;
    padding: 0 16px 14px;
    font-size: 13px;
    color: var(--text-soft);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    line-height: 1.6;
  }

  .history-day-detail.open { display: block; }

  /* WEEKLY CALENDAR VIEW */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 20px;
  }

  .week-cell {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .week-cell.taken { background: var(--accent); color: white; }
  .week-cell.skipped { background: var(--skipped); color: white; }
  .week-cell.pending { background: var(--surface2); color: var(--text-soft); }
  .week-cell.future { background: var(--surface2); color: var(--border); }
  .week-cell.today-cell { outline: 2px solid var(--accent); outline-offset: 2px; }

  .week-day-label {
    font-weight: 600;
    font-size: 10px;
    line-height: 1;
  }

  .week-day-num {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.2;
  }

  /* SETTINGS */
  .settings-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .settings-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-soft);
    margin-bottom: 8px;
    display: block;
  }

  .settings-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
  }

  .settings-input:focus { border-color: var(--accent); }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .settings-row:last-child { border-bottom: none; }

  .settings-row-label { font-size: 15px; font-weight: 400; }
  .settings-row-sub { font-size: 12px; color: var(--text-soft); }

  /* TOGGLE */
  .toggle {
    position: relative;
    width: 44px;
    height: 26px;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .slider {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 20px;
    transition: 0.2s;
    cursor: pointer;
  }

  .slider:before {
    content: '';
    position: absolute;
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  input:checked + .slider { background: var(--accent); }
  input:checked + .slider:before { transform: translateX(18px); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-soft);
  }

  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-title { font-size: 17px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .empty-sub { font-size: 14px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: white;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 12px;
    z-index: 100;
  }

  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: var(--text-soft);
    transition: color 0.2s;
  }

  .nav-btn.active { color: var(--accent); }

  .nav-icon { font-size: 22px; line-height: 1; }

  /* CONFIRM MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 24px;
    width: 100%;
    max-width: 480px;
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    margin-bottom: 8px;
  }

  .modal-sub { font-size: 14px; color: var(--text-soft); margin-bottom: 20px; }

  .modal-buttons { display: flex; gap: 10px; }

  @media (min-width: 480px) {
    .section { max-width: 480px; margin: 0 auto; }
    header { padding: 20px calc(50% - 216px) 16px; }
    .tabs { max-width: 480px; margin: 0 auto; }
    .bottom-nav { max-width: 480px; left: 50%; transform: translateX(-50%); border-radius: 20px 20px 0 0; border: 1px solid var(--border); border-bottom: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="app-title">💊 Mi pastillero</div>
      <div class="date-label" id="headerDate"></div>
    </div>
    <div class="streak-badge" id="streakBadge">🔥 <span id="streakCount">0</span> días</div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('today', this)">Hoy</button>
  <button class="tab" onclick="switchTab('history', this)">Historial</button>
  <button class="tab" onclick="switchTab('settings', this)">⚙️ Config</button>
</div>

<!-- TODAY -->
<div class="section active" id="tab-today">

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-number green" id="statTaken">0</div>
      <div class="stat-label">Tomadas</div>
    </div>
    <div class="stat-card">
      <div class="stat-number orange" id="statSkipped">0</div>
      <div class="stat-label">Saltadas</div>
    </div>
    <div class="stat-card">
      <div class="stat-number gold" id="statPct">—</div>
      <div class="stat-label">Adherencia</div>
    </div>
  </div>

  <div class="today-hero" id="todayCard">
    <div class="today-pill-name" id="pillName">Mi pastilla</div>
    <div class="today-pill-sub" id="pillDose">Dosis diaria</div>

    <div class="status-indicator pending" id="statusIndicator">
      <div class="status-dot"></div>
      <span id="statusText">Pendiente para hoy</span>
    </div>

    <div class="action-buttons" id="actionButtons">
      <button class="btn btn-primary" id="btnTake" onclick="takePill()">
        ✓ Ya la tomé
      </button>
      <button class="btn btn-danger" id="btnSkip" onclick="openSkipModal()">
        ✕ Saltarla
      </button>
    </div>

    <div class="time-taken-info" id="timeTakenInfo" style="display:none"></div>
  </div>

  <div class="section-title">Esta semana</div>
  <div class="week-grid" id="weekGrid"></div>

</div>

<!-- HISTORY -->
<div class="section" id="tab-history">
  <div class="section-title">Registro completo</div>
  <div class="history-list" id="historyList"></div>
</div>

<!-- SETTINGS -->
<div class="section" id="tab-settings">
  <div class="settings-card">
    <label class="settings-label">Nombre del medicamento</label>
    <input class="settings-input" id="inputPillName" type="text" placeholder="Ej: Metformina 500mg" />
    <br><br>
    <label class="settings-label">Dosis / nota adicional</label>
    <input class="settings-input" id="inputPillDose" type="text" placeholder="Ej: 1 pastilla con el desayuno" />
    <br><br>
    <button class="btn btn-primary" style="max-width:200px" onclick="saveSettings()">Guardar</button>
  </div>

  <div class="settings-card">
    <div class="settings-row">
      <div>
        <div class="settings-row-label">Borrar todos los datos</div>
        <div class="settings-row-sub">Reinicia el historial completamente</div>
      </div>
      <button class="btn btn-danger" style="flex:0; padding:8px 14px; font-size:13px" onclick="clearAll()">Borrar</button>
    </div>
  </div>
</div>

<!-- SKIP MODAL -->
<div class="modal-overlay" id="skipModal">
  <div class="modal">
    <div class="modal-title">¿Saltarte la pastilla hoy?</div>
    <div class="modal-sub">Queda registrado como día saltado. Puedes cambiar esto más tarde.</div>
    <div class="modal-buttons">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="skipPill()">Sí, saltarla</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STORAGE ───────────────────────────────────────────
const STORAGE_KEY = 'pastillero_v1';

function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { records: {}, pillName: 'Mi pastilla', pillDose: 'Dosis diaria' };
  } catch { return { records: {}, pillName: 'Mi pastilla', pillDose: 'Dosis diaria' }; }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ─── HELPERS ───────────────────────────────────────────
function today() {
  return new Date().toISOString().slice(0, 10);
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}

function relativeLabel(dateStr) {
  const t = today();
  if (dateStr === t) return 'Hoy';
  const diff = Math.round((new Date(t) - new Date(dateStr)) / 86400000);
  if (diff === 1) return 'Ayer';
  if (diff <= 6) return `Hace ${diff} días`;
  return '';
}

function timeLabel(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

function formatPct(pct) {
  if (isNaN(pct)) return '—';
  return Math.round(pct) + '%';
}

// ─── TOAST ─────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ─── TABS ──────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'history') renderHistory();
  if (name === 'settings') loadSettingsForm();
}

// ─── RENDER TODAY ───────────────────────────────────────
function renderToday() {
  const data = loadData();
  const t = today();
  const rec = data.records[t];

  // pill info
  document.getElementById('pillName').textContent = data.pillName || 'Mi pastilla';
  document.getElementById('pillDose').textContent = data.pillDose || 'Dosis diaria';

  // header date
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

  // status
  const indicator = document.getElementById('statusIndicator');
  const statusText = document.getElementById('statusText');
  const timeTaken = document.getElementById('timeTakenInfo');
  const actionBtns = document.getElementById('actionButtons');

  indicator.className = 'status-indicator';
  timeTaken.style.display = 'none';
  actionBtns.style.display = 'flex';

  if (!rec) {
    indicator.classList.add('pending');
    statusText.textContent = 'Pendiente para hoy';
    document.getElementById('btnTake').disabled = false;
    document.getElementById('btnSkip').disabled = false;
  } else if (rec.status === 'taken') {
    indicator.classList.add('taken');
    statusText.textContent = '¡Ya tomaste tu pastilla hoy! 🎉';
    timeTaken.style.display = 'block';
    timeTaken.textContent = `Registrado a las ${timeLabel(rec.ts)}`;
    document.getElementById('btnTake').disabled = true;
    document.getElementById('btnTake').textContent = '✓ Ya tomada';
    document.getElementById('btnSkip').disabled = false;
  } else if (rec.status === 'skipped') {
    indicator.classList.add('skipped');
    statusText.textContent = 'Saltada hoy — sin problema, sigue adelante';
    actionBtns.style.display = 'flex';
    document.getElementById('btnTake').disabled = false;
    document.getElementById('btnTake').textContent = '✓ Tomarla ahora';
    document.getElementById('btnSkip').disabled = true;
  }

  // stats
  const allRecords = Object.values(data.records);
  const taken = allRecords.filter(r => r.status === 'taken').length;
  const skipped = allRecords.filter(r => r.status === 'skipped').length;
  const total = taken + skipped;
  document.getElementById('statTaken').textContent = taken;
  document.getElementById('statSkipped').textContent = skipped;
  document.getElementById('statPct').textContent = total > 0 ? Math.round((taken / total) * 100) + '%' : '—';

  // streak
  let streak = 0;
  let d = new Date();
  while (true) {
    const key = d.toISOString().slice(0, 10);
    if (data.records[key] && data.records[key].status === 'taken') { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  document.getElementById('streakCount').textContent = streak;

  // week grid
  renderWeekGrid(data);
}

function renderWeekGrid(data) {
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  const days = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  const t = today();

  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    const rec = data.records[key];
    const dayName = days[d.getDay()];
    const dayNum = d.getDate();
    const isToday = key === t;

    let cls = 'week-cell pending';
    let icon = '';
    if (rec?.status === 'taken') { cls = 'week-cell taken'; icon = ''; }
    else if (rec?.status === 'skipped') { cls = 'week-cell skipped'; icon = ''; }

    if (isToday) cls += ' today-cell';

    grid.innerHTML += `<div class="${cls}">
      <div class="week-day-label">${dayName}</div>
      <div class="week-day-num">${dayNum}</div>
    </div>`;
  }
}

// ─── ACTIONS ───────────────────────────────────────────
function takePill() {
  const data = loadData();
  const t = today();
  data.records[t] = { status: 'taken', ts: Date.now() };
  saveData(data);
  showToast('✓ Registrado. ¡Bien hecho!');
  renderToday();
}

function openSkipModal() {
  document.getElementById('skipModal').classList.add('open');
}

function closeModal() {
  document.getElementById('skipModal').classList.remove('open');
}

function skipPill() {
  closeModal();
  const data = loadData();
  const t = today();
  data.records[t] = { status: 'skipped', ts: Date.now() };
  saveData(data);
  showToast('Registrado como saltada');
  renderToday();
}

// ─── HISTORY ───────────────────────────────────────────
function renderHistory() {
  const data = loadData();
  const list = document.getElementById('historyList');
  const keys = Object.keys(data.records).sort((a, b) => b.localeCompare(a));

  if (keys.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-title">Sin registros aún</div>
      <div class="empty-sub">Empieza registrando tu pastilla de hoy</div>
    </div>`;
    return;
  }

  list.innerHTML = keys.map(k => {
    const rec = data.records[k];
    const status = rec.status;
    const icon = status === 'taken' ? '✓' : '✕';
    const rel = relativeLabel(k);
    const fullDate = formatDate(k);
    const chipLabel = status === 'taken' ? 'Tomada' : 'Saltada';
    const detail = status === 'taken'
      ? `Tomada a las <strong>${timeLabel(rec.ts)}</strong>`
      : `Marcada como saltada a las <strong>${timeLabel(rec.ts)}</strong>`;

    return `<div class="history-day">
      <div class="history-day-header" onclick="toggleDay(this)">
        <div class="history-day-left">
          <div class="day-icon ${status}">${icon}</div>
          <div>
            <div class="day-date">${rel || fullDate}</div>
            ${rel ? `<div class="day-relative">${fullDate}</div>` : ''}
          </div>
        </div>
        <span class="day-status-chip ${status}">${chipLabel}</span>
      </div>
      <div class="history-day-detail">${detail}</div>
    </div>`;
  }).join('');
}

function toggleDay(header) {
  const detail = header.nextElementSibling;
  detail.classList.toggle('open');
}

// ─── SETTINGS ──────────────────────────────────────────
function loadSettingsForm() {
  const data = loadData();
  document.getElementById('inputPillName').value = data.pillName || '';
  document.getElementById('inputPillDose').value = data.pillDose || '';
}

function saveSettings() {
  const data = loadData();
  data.pillName = document.getElementById('inputPillName').value.trim() || 'Mi pastilla';
  data.pillDose = document.getElementById('inputPillDose').value.trim() || 'Dosis diaria';
  saveData(data);
  showToast('✓ Configuración guardada');
  renderToday();
}

function clearAll() {
  if (confirm('¿Borrar todo el historial? Esta acción no se puede deshacer.')) {
    localStorage.removeItem(STORAGE_KEY);
    showToast('Datos borrados');
    renderToday();
  }
}

// ─── INIT ──────────────────────────────────────────────
renderToday();
</script>
